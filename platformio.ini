[env]
platform  = espressif32
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600

; LittleFS for serving web UI files
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DASYNC_TCP_SSL_ENABLED=0

lib_deps =
    ; Async web server
    me-no-dev/ESPAsyncWebServer @ ^1.2.3
    me-no-dev/AsyncTCP         @ ^1.1.1

    ; JSON
    bblanchon/ArduinoJson @ ^7.3.0

    ; LED strip
    fastled/FastLED @ ^3.9.0

    ; WebSocket client (SignalR)
    links2004/WebSockets @ ^2.4.1

    ; WiFi provisioning (captive portal on first boot)
    tzapu/WiFiManager @ ^2.0.17

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ; Route Serial to the native USB port (cu.usbmodem*)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
