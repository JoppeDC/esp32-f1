[platformio]
default_envs = esp32c3

[env]
; Pinned: 6.x ships Arduino core 2.0.17, which the TLS/mbedTLS findings in
; docs/superpowers/specs/2026-07-28-esp32-relay-client-design.md were
; verified against. Bump deliberately, not by accident.
platform  = espressif32 @ 6.11.0
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600

; LittleFS for serving web UI files
board_build.filesystem = littlefs

; The default table splits 4 MB into two 1.25 MB app slots, leaving the app at
; ~90% full. min_spiffs widens both slots to 1.875 MB (~60%) while keeping the
; second one, so OTA stays possible. The filesystem drops to 128 KB, which fits
; data/ (48 KB) with room to spare. NVS stays at 0x9000, so saved WiFi
; credentials and config survive the switch — but the filesystem partition
; moves, so re-run `uploadfs` after flashing this.
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    ; Async web server — the maintained ESP32Async line (the me-no-dev
    ; originals have had no release since 2019)
    esp32async/ESPAsyncWebServer @ 3.12.1
    esp32async/AsyncTCP          @ 3.5.0

    ; JSON
    bblanchon/ArduinoJson @ ^7.3.0

    ; LED strip
    fastled/FastLED @ ^3.9.0

    ; WebSocket client (relay)
    links2004/WebSockets @ ^2.4.1

    ; WiFi provisioning (captive portal on first boot)
    tzapu/WiFiManager @ ^2.0.17

[env:esp32dev]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ; Route Serial to the native USB port (cu.usbmodem*)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
